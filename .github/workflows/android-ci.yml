name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # required to attach APKs to a GitHub Release on tag push

jobs:
  build:
    name: Build debug + release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Only runs if the RELEASE_KEYSTORE_BASE64 secret has been set on the repo
      # (Settings -> Secrets and variables -> Actions). Absent that secret, the
      # release build below automatically falls back to debug signing so the
      # workflow still succeeds and still produces an installable APK.
      - name: Decode release keystore (if configured)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/app/release-keystore.jks"
            echo "Decoded release keystore — release APK will be properly signed."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set — release build will fall back to debug signing."
          fi

      - name: Build debug and release APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build.log > build-tail.log
          CONTENT=$(base64 -w0 build-tail.log)
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/latest-failure.log" \
            -d "{\"message\":\"CI failure log for run ${{ github.run_id }}\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"

      - name: Rename outputs for clarity
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Android-Guardian-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Android-Guardian-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Guardian-debug
          path: out/Android-Guardian-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Guardian-release
          path: out/Android-Guardian-release.apk

      # Only fires on tag pushes (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Android-Guardian-debug.apk
            out/Android-Guardian-release.apk
          generate_release_notes: true
