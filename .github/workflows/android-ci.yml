name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # required to create/publish GitHub Releases each successful build

jobs:
  build:
    name: Build debug + release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release version
        id: relver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Only runs if the RELEASE_KEYSTORE_BASE64 secret has been set on the repo
      # (Settings -> Secrets and variables -> Actions). Absent that secret, the
      # release build below automatically falls back to debug signing so the
      # workflow still succeeds and still produces an installable APK.
      - name: Decode release keystore (if configured)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/app/release-keystore.jks"
            echo "Decoded release keystore — release APK will be properly signed."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set — release build will fall back to debug signing."
          fi

      - name: Build debug and release APKs
        env:
          VERSION_CODE: ${{ steps.relver.outputs.version_code }}
          VERSION_NAME: ${{ steps.relver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: List produced outputs (diagnostic)
        if: always()
        run: |
          echo "---- app/build/outputs tree ----" >> build.log
          find app/build/outputs -type f >> build.log 2>&1 || true

      - name: Rename outputs for clarity
        run: |
          mkdir -p out
          find app/build/outputs -name "*-debug.apk" -exec cp {} out/Android-Guardian-debug.apk \; || true
          find app/build/outputs -name "*-release*.apk" -exec cp {} out/Android-Guardian-release.apk \; || true
          find app/build/outputs -name "*.apk" -exec cp {} out/ \; || true

      - name: Publish build log if any prior step failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish build log to repo (temporary debug aid)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import base64, json, urllib.request
          with open('build.log', 'rb') as f:
              content = base64.b64encode(f.read()).decode()
          existing_sha = None
          req = urllib.request.Request(
              'https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/latest-failure.log',
              headers={'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}', 'Accept': 'application/vnd.github+json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  existing_sha = json.load(resp)['sha']
          except Exception:
              pass
          payload = {'message': 'CI failure log for run ${{ github.run_id }}', 'content': content, 'branch': 'main'}
          if existing_sha:
              payload['sha'] = existing_sha
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          "
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/latest-failure.log" \
            --data-binary @payload.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Guardian-debug
          path: out/Android-Guardian-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Guardian-release
          path: out/Android-Guardian-release.apk

      # Publishes a GitHub Release on every successful build (not on pull_request
      # runs, to avoid releasing untrusted/unmerged code). If this run was
      # triggered by pushing a `v*` tag directly, that tag is reused as-is;
      # otherwise an auto-incrementing `v1.0.<run_number>` tag is created.
      # softprops/action-gh-release creates the tag automatically if it doesn't
      # already exist, pointed at the commit that triggered this run.
      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relver.outputs.tag }}
          name: ${{ steps.relver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/Android-Guardian-debug.apk
            out/Android-Guardian-release.apk
